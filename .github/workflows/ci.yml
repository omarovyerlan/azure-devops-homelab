name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v

  build:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t homelab-status:${{ github.sha }} ./app

      - name: Start container
        run: docker run -d -p 8080:8080 --name homelab-status homelab-status:${{ github.sha }}

      - name: Check /health endpoint
        run: |
          for i in $(seq 1 10); do
            if curl -fs http://localhost:8080/health; then
              echo ""
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy"
          docker logs homelab-status
          exit 1
